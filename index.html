<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>国産パソコン年表</title>
<meta name="description" content="1978年9月から始まった国産パソコンを、メーカー別・月単位等間隔で表示するインタラクティブ年表ビューアです。">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand">
    <h1>国産パソコン年表</h1>
    <p class="sub">1か月＝等間隔</p>
  </div>

  <div class="controls">
    <div class="ctl-group" id="makerToggles" role="group" aria-label="メーカー表示の切り替え"></div>

    <div class="ctl-group" id="bitToggles" role="group" aria-label="ビット数での絞り込み"></div>

    <div class="ctl-group">
      <label class="visually-hidden" for="searchInput">機種名検索</label>
      <input id="searchInput" class="search" type="search" placeholder="機種名で検索 (Enterで移動)" autocomplete="off" spellcheck="false">
      <span id="searchCount" class="count" aria-live="polite"></span>
      <button id="searchClear" type="button" class="btn ghost" title="検索をクリア">×</button>
    </div>

    <div class="ctl-group">
      <label for="yearJump">年へ移動</label>
      <select id="yearJump" class="select"></select>
    </div>

    <div class="ctl-group" role="group" aria-label="拡大縮小">
      <button id="zoomOut" type="button" class="btn" title="縮小">&minus;</button>
      <span id="zoomLabel" class="count" aria-live="polite">100%</span>
      <button id="zoomIn" type="button" class="btn" title="拡大">&plus;</button>
      <button id="zoomReset" type="button" class="btn ghost" title="等倍に戻す">等倍</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>
</header>

<main>
  <p id="status" class="status" role="status">年表データを読み込んでいます&hellip;</p>
  <div id="scroller" class="scroller" tabindex="0" aria-label="年表本体 (スクロールできます)">
    <svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="国産パソコン年表"></svg>
  </div>
  <p class="hint">機種のボックスをクリック（またはEnter/Space）すると詳細が開きます。</p>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <button id="modalClose" type="button" class="modal-close" aria-label="閉じる">×</button>
    <p class="modal-maker" id="modalMaker"></p>
    <h2 class="modal-title" id="modalTitle"></h2>
    <dl class="modal-dl" id="modalBody"></dl>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
